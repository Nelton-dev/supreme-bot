<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alterar Avatar — Admin</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap');
    :root { --red: #e94560; --bg: #07080d; --surface: #0e0f1a; --border: rgba(233,69,96,0.25); --text: #e8e8f0; --muted: #6b6d8a; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .container { max-width: 500px; width: 90%; padding: 20px; text-align: center; }
    h1 { font-family: 'Rajdhani', sans-serif; font-size: 1.6rem; margin-bottom: 6px; }
    .subtitle { color: var(--muted); font-size: 0.85rem; margin-bottom: 20px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 24px; }
    .avatar-preview { width: 140px; height: 140px; border-radius: 50%; object-fit: cover; border: 3px solid var(--red); margin: 0 auto 16px; display: block; background: #141528; }
    .btn { display: inline-block; padding: 10px 20px; border-radius: 10px; cursor: pointer; font-size: 0.85rem; font-weight: 600; border: none; margin: 6px; }
    .btn-primary { background: var(--red); color: #fff; }
    .btn-danger { background: rgba(192,57,43,0.15); color: #e74c3c; border: 1px solid rgba(192,57,43,0.3); }
    .upload-area { border: 2px dashed var(--border); border-radius: 12px; padding: 20px; margin: 14px 0; cursor: pointer; }
    .upload-area:hover { border-color: var(--red); }
    input[type="file"] { display: none; }
    .back-link { color: var(--muted); text-decoration: none; font-size: 0.8rem; display: block; margin-top: 14px; }
    #toast { position: fixed; bottom: 20px; right: 20px; background: #141528; border: 1px solid var(--border); border-radius: 10px; padding: 12px 18px; font-size: 0.8rem; display: none; z-index: 100; }
    #toast.show { display: block; animation: slideIn .3s ease; }
    @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
<div class="container">
  <h1>🎨 Admin — Alterar Avatar</h1>
  <p class="subtitle" id="nomeCaçador">Carregando...</p>
  <div class="card">
    <img class="avatar-preview" id="preview" alt="Avatar">
    <div class="upload-area" onclick="document.getElementById('fileInput').click()">
      <p>📁 Clique para escolher imagem</p>
      <p style="font-size:0.7rem;color:var(--muted)">JPG, PNG, GIF (máx 5MB)</p>
    </div>
    <input type="file" id="fileInput" accept="image/*" onchange="previewImage(event)">
    <button class="btn btn-primary" onclick="salvarAvatar()">💾 Salvar</button>
    <button class="btn btn-danger" onclick="removerAvatar()">🗑️ Remover</button>
    <a class="back-link" href="/">← Voltar ao Dashboard</a>
  </div>
</div>
<div id="toast"></div>
<script>
const nome = decodeURIComponent(window.location.pathname.split('/').pop())
document.getElementById('nomeCaçador').textContent = 'Caçador: ' + nome
let imagemBase64 = null
function mostrarToast(m, d = 3000) { const t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), d) }
async function carregar() { document.getElementById('preview').src = '/api/admin/avatar-img/' + encodeURIComponent(nome) + '?' + Date.now() }
carregar()
function previewImage(event) {
  const file = event.target.files[0]
  if (!file) return
  if (file.size > 5*1024*1024) { mostrarToast('❌ Imagem muito grande!'); return }
  const reader = new FileReader()
  reader.onload = (e) => { document.getElementById('preview').src = e.target.result; imagemBase64 = e.target.result }
  reader.readAsDataURL(file)
}
async function salvarAvatar() {
  if (!imagemBase64) { mostrarToast('⚠️ Escolha uma imagem!'); return }
  const res = await fetch('/api/admin/avatar/' + encodeURIComponent(nome), { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ imagem: imagemBase64 }) })
  const data = await res.json()
  mostrarToast(data.ok ? '✅ Avatar salvo!' : '❌ Erro')
}
async function removerAvatar() {
  if (!confirm('Remover avatar de ' + nome + '?')) return
  await fetch('/api/admin/avatar/' + encodeURIComponent(nome), { method: 'DELETE' })
  mostrarToast('✅ Removido!')
  imagemBase64 = null
  carregar()
}
</script>
</body>
</html>
