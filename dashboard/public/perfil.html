<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil do Caçador — Nexus World</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap');
    :root { --red: #e94560; --gold: #f0a500; --bg: #07080d; --surface: #0e0f1a; --surface2: #141528; --border: rgba(233,69,96,0.25); --text: #e8e8f0; --muted: #6b6d8a; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; min-height: 100vh; }
    body::before { content: ''; position: fixed; inset: 0; background-image: linear-gradient(rgba(233,69,96,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(233,69,96,0.04) 1px, transparent 1px); background-size: 40px 40px; pointer-events: none; z-index: 0; }
    .container { max-width: 600px; margin: auto; padding: 30px 20px; position: relative; z-index: 1; }
    .back-link { color: var(--muted); text-decoration: none; font-size: 0.85rem; display: inline-block; margin-bottom: 16px; }
    header { text-align: center; margin-bottom: 24px; }
    .avatar-grande { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 3px solid var(--red); margin: 0 auto 12px; display: block; cursor: pointer; background: var(--surface2); }
    h1 { font-family: 'Rajdhani', sans-serif; font-size: 1.8rem; color: #fff; }
    .rank-badge { display: inline-block; background: var(--red); color: #fff; padding: 4px 16px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; margin: 6px 0; }
    .avatar-link { display: block; text-align: center; color: var(--muted); font-size: 0.75rem; margin-top: 4px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 18px; margin-bottom: 14px; }
    .card h2 { font-family: 'Rajdhani', sans-serif; font-size: 1rem; color: var(--red); margin-bottom: 10px; }
    .stat-row { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,0.04); font-size: 0.82rem; }
    .stat-row span:last-child { font-weight: 600; color: #fff; }
    .progress-bar { width: 100%; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; margin: 8px 0; }
    .progress-fill { height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--red), var(--gold)); }
    .elementos { display: flex; gap: 6px; flex-wrap: wrap; }
    .elemento-badge { background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; font-size: 0.75rem; }
    .loading { text-align: center; padding: 60px; color: var(--muted); }
    .spinner { width: 36px; height: 36px; border: 3px solid rgba(233,69,96,0.2); border-top-color: var(--red); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 15px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div class="container" id="app">
  <div class="loading"><div class="spinner"></div><p>A carregar perfil...</p></div>
</div>
<script>
const nome = decodeURIComponent(window.location.pathname.split('/').pop())
document.title = nome + ' — Nexus World'
async function carregar() {
  try {
    const data = await fetch('/api/cacador/' + encodeURIComponent(nome)).then(r => r.json())
    if (data.erro) { document.getElementById('app').innerHTML = '<div class="loading"><p>❌ ' + data.erro + '</p><br><a href="/ranking" class="back-link">← Ranking</a></div>'; return }
    const barra = '█'.repeat(Math.floor(data.progressoRank / 10)) + '░'.repeat(10 - Math.floor(data.progressoRank / 10))
    const afinidade = data.afinidade && Object.keys(data.afinidade).length > 0 ? Object.entries(data.afinidade).map(([el, nv]) => '<span class="elemento-badge">' + el + ' ⭐' + nv + '</span>').join('') : 'Nenhuma'
    const artefatos = data.artefatos && data.artefatos.length > 0 ? data.artefatos.map(a => '• ' + a.nome).join('<br>') : 'Nenhum'
    document.getElementById('app').innerHTML = `
      <a href="/ranking" class="back-link">← Ranking Público</a>
      <header>
        <img class="avatar-grande" src="/api/cacador/${encodeURIComponent(data.nome)}/avatar-img?${Date.now()}" alt="Avatar" onclick="window.location.href='/cacador/${encodeURIComponent(data.nome)}/avatar'" title="Clique para personalizar">
        <h1>${data.nome}</h1>
        <div class="rank-badge">${data.titulo_rank || 'Caçador Rank E'}</div>
        <a class="avatar-link" href="/cacador/${encodeURIComponent(data.nome)}/avatar">🎨 Personalizar Avatar</a>
      </header>
      <div class="card">
        <h2>📊 Progresso do Rank</h2>
        <div class="stat-row"><span>Rank</span><span>${data.rank}</span></div>
        <div class="stat-row"><span>XP</span><span>${data.xp_rank} / Próx: ${data.proxRank || 'Máximo'}</span></div>
        <div class="progress-bar"><div class="progress-fill" style="width:${data.progressoRank}%"></div></div>
        <div style="text-align:center;font-size:0.75rem;color:var(--muted)">[${barra}] ${data.progressoRank}%</div>
      </div>
      <div class="card">
        <h2>⚔️ Estatísticas</h2>
        <div class="stat-row"><span>Nível</span><span>${data.nivel}</span></div>
        <div class="stat-row"><span>XP</span><span>${data.xp}</span></div>
        <div class="stat-row"><span>Pontos</span><span>${data.pontos}</span></div>
        <div class="stat-row"><span>Ataque</span><span>${data.ataque}</span></div>
        <div class="stat-row"><span>Vida</span><span>${data.vida}</span></div>
        <div class="stat-row"><span>Vitórias</span><span>${data.vitorias}</span></div>
      </div>
      <div class="card">
        <h2>🔮 Elemento</h2>
        <div class="stat-row"><span>Elemento</span><span>${data.elemento || '―'}</span></div>
        <div class="stat-row"><span>Habilidade</span><span>${data.habilidade_ativa}</span></div>
        <div class="stat-row"><span>Pet</span><span>${data.pet_ativo}</span></div>
        <div class="stat-row"><span>Afinidade</span><div class="elementos">${afinidade}</div></div>
      </div>
      <div class="card">
        <h2>🏰 Social</h2>
        <div class="stat-row"><span>Guilda</span><span>${data.guilda ? data.guilda.emblema + ' ' + data.guilda.nome : 'Nenhuma'}</span></div>
        <div class="stat-row"><span>Conquistas</span><span>${data.conquistas} / 10</span></div>
        <div class="stat-row"><span>Missões Épicas</span><span>${data.missoesEpicas} / 12</span></div>
        <div class="stat-row"><span>Artefatos</span><span>${artefatos}</span></div>
        <div class="stat-row"><span>Itens</span><span>${data.inventario}</span></div>
      </div>`
  } catch(e) { document.getElementById('app').innerHTML = '<div class="loading">❌ Erro ao carregar.</div>' }
}
carregar()
</script>
</body>
</html>
