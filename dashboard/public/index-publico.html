<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ranking — Nexus World</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap');
    :root { --red: #e94560; --gold: #f0a500; --bg: #07080d; --surface: #0e0f1a; --border: rgba(233,69,96,0.25); --text: #e8e8f0; --muted: #6b6d8a; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; min-height: 100vh; }
    .container { max-width: 700px; margin: auto; padding: 30px 20px; }
    h1 { font-family: 'Rajdhani', sans-serif; font-size: 2rem; text-align: center; background: linear-gradient(135deg, #fff, var(--red), var(--gold)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 30px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 14px; margin-bottom: 10px; display: flex; align-items: center; gap: 12px; }
    .posicao { font-family: 'Rajdhani', sans-serif; font-size: 1.4rem; font-weight: 700; color: var(--red); width: 35px; text-align: center; }
    .avatar { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, var(--red), var(--gold)); display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: 700; color: #fff; flex-shrink: 0; }
    .info { flex: 1; }
    .nome { font-weight: 600; font-size: 0.9rem; }
    .nome a { color: #fff; text-decoration: none; }
    .nome a:hover { color: var(--red); }
    .detalhes { font-size: 0.7rem; color: var(--muted); }
    .rank-badge { background: var(--red); color: #fff; padding: 2px 10px; border-radius: 12px; font-size: 0.7rem; font-weight: 600; }
    .xp { text-align: right; font-weight: 600; font-size: 0.85rem; }
    .loading { text-align: center; padding: 60px; color: var(--muted); }
  </style>
</head>
<body>
<div class="container">
  <h1>🏆 Ranking do Nexus World</h1>
  <div id="ranking"></div>
</div>
<script>
async function carregar() {
  const data = await fetch('/api/ranking-publico').then(r => r.json())
  document.getElementById('ranking').innerHTML = data.map(c =>
    '<div class="card">' +
      '<div class="posicao">' + c.posicao + '</div>' +
      '<div class="avatar">' + c.nome.split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase() + '</div>' +
      '<div class="info"><div class="nome"><a href="/cacador/' + encodeURIComponent(c.nome) + '">' + c.nome + '</a></div><div class="detalhes">' + (c.elemento || '―') + '</div></div>' +
      '<div class="rank-badge">' + c.rank + '</div>' +
      '<div class="xp">' + c.xp_rank + ' XP</div>' +
    '</div>'
  ).join('')
}
carregar()
</script>
</body>
</html>
